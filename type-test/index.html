<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職業タイプ診断｜可能性ラボ</title>
<meta name="description" content="20の質問で、あなたの「働き方の本質」を16タイプで診断。4つの軸からあなたの強みを言語化します。可能性ラボのキャリアタイプ診断。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="hd">
    <div class="hd-in">
      <a href="index.html" class="hd-logo"><img src="logo.png" alt="可能性ラボ"></a>
      <span class="hd-tag">Career Type Diagnosis</span>
    </div>
  </header>

  <!-- プログレス（質問中のみ表示。app.js が制御） -->
  <div class="pg" id="progress" style="display:none;">
    <div class="pg-labels">
      <span class="pg-step">Question</span>
      <span class="pg-count" id="progressCount"></span>
    </div>
    <div class="pg-bar"><div class="pg-bar-fill" id="progressFill"></div></div>
  </div>

  <!-- 画面マウント先 -->
  <main class="stage" id="stage"><!-- app.js が intro / question / result を描画 --></main>

  <!-- フッター -->
  <footer class="ft">
    可能性ラボ — 職業タイプ診断
  </footer>

  <!-- 依存順に読み込み（モジュールではなくグローバル前提） -->
  <script src="js/questions.js"></script>
  <script src="js/types.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
