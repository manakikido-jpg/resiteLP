<!-- ===========================================================
     PAGE LOADER (loading-6) — 初回ロード時のブランドローダー
     設置場所：<body> 直後（CSS+マークアップ）。コントローラ <script> はページ末尾。
     依存：assets/logo.png（カラーロゴ）。約2.2秒の擬似進捗＋6秒セーフティタイマー。
     本番では「実際のアセット/データ読込完了」に finish() を連動させると尚良し。
     =========================================================== -->

<!-- ▼ <body> 直後に挿入 -->
<style>
.pl-overlay{ position:fixed; inset:0; z-index:99999; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:linear-gradient(150deg, #EAF4FD 0%, #DCECFB 40%, #CFE4F8 72%, #C2DBF3 100%);
  opacity:1; transition:opacity .7s ease, visibility .7s ease; }
.pl-overlay.pl-hide{ opacity:0; visibility:hidden; pointer-events:none; }
.pl-overlay::before{ content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 32%, rgba(255,255,255,0.6) 0%, transparent 55%), radial-gradient(ellipse 70% 60% at 90% 95%, rgba(120,170,220,0.22) 0%, transparent 58%); }
.pl-stage{ display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
.pl-logo{ width:380px; max-width:74vw; display:block; transform-origin:center; filter:drop-shadow(0 8px 26px rgba(70,120,180,0.16));
  opacity:0; animation:pl-in 1.1s cubic-bezier(.22,.8,.25,1) forwards, pl-breathe 3.4s ease-in-out 1.1s infinite; }
@keyframes pl-in{ 0%{opacity:0; transform:scale(.96);} 100%{opacity:1; transform:scale(1);} }
@keyframes pl-breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.018);} }
.pl-prog{ margin-top:46px; width:300px; max-width:62vw; opacity:0; animation:pl-fade .7s ease .35s forwards; }
@keyframes pl-fade{ to{opacity:1;} }
.pl-prog .pl-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:11px; }
.pl-cap{ font-family:'Syne',sans-serif; font-weight:500; font-size:.6rem; letter-spacing:.4em; text-transform:uppercase; color:#2A7AB8; padding-left:.4em; }
.pl-pct{ font-family:'Syne',sans-serif; font-weight:600; font-size:.82rem; color:#2A7AB8; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
.pl-bar{ height:3px; border-radius:3px; background:#C7DCF0; overflow:hidden; position:relative; }
.pl-bar i{ position:absolute; inset:0; width:0; border-radius:3px; background:linear-gradient(90deg,#2A7AB8,#5BA3D4); }
body.pl-lock{ overflow:hidden; }
@media (prefers-reduced-motion: reduce){ .pl-logo,.pl-prog{ animation:none; opacity:1; } }
</style>
<div class="pl-overlay" id="plOverlay">
  <div class="pl-stage">
    <img class="pl-logo" src="assets/logo.png" alt="可能性ラボ">
    <div class="pl-prog">
      <div class="pl-row"><span class="pl-cap">Loading</span><span class="pl-pct" id="plPct">0%</span></div>
      <div class="pl-bar"><i id="plFill"></i></div>
    </div>
  </div>
</div>

<!-- ▼ ページ末尾（</body> 直前）に挿入 -->
<script>
(function(){
  var ov=document.getElementById('plOverlay'); if(!ov) return;
  var pct=document.getElementById('plPct'), fill=document.getElementById('plFill');
  document.body.classList.add('pl-lock');
  var dur=2200, start=null, done=false;
  function finish(){ if(done) return; done=true; ov.classList.add('pl-hide'); document.body.classList.remove('pl-lock'); setTimeout(function(){ if(ov&&ov.parentNode){ ov.parentNode.removeChild(ov); } }, 800); }
  function frame(t){ if(start===null) start=t; var p=(t-start)/dur; if(p>1)p=1; var v=p<0.9?(p/0.9)*94:94+((p-0.9)/0.1)*6; pct.textContent=Math.round(v)+'%'; fill.style.width=v+'%'; if(p<1){ requestAnimationFrame(frame); } else { setTimeout(finish,320); } }
  requestAnimationFrame(frame);
  setTimeout(finish, 6000); // セーフティ：描画が詰まっても確実に消す
})();
</script>
